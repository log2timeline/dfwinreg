# Run docs tox tests on Ubuntu Docker images using the deadsnakes and GIFT PPAs
name: test_docs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.14']
    container:
      image: ubuntu:26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up container
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Retry apt downloads, since the Launchpad PPAs are intermittently unavailable.
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' > /etc/apt/apt.conf.d/80-retries
        apt_ok=0
        for attempt in 1 2 3; do
          if apt update -q && apt install -y --fix-missing libterm-readline-gnu-perl locales software-properties-common; then
            apt_ok=1
            break
          fi
          echo "apt attempt ${attempt} failed"
          sleep $((attempt * 30))
        done
        [ "${apt_ok}" = 1 ] || { echo 'apt failed after 3 attempts'; exit 1; }
        locale-gen en_US.UTF-8
        ln -f -s /usr/share/zoneinfo/UTC /etc/localtime
    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        add-apt-repository -y universe
        add-apt-repository -y ppa:deadsnakes/ppa
        add-apt-repository -y ppa:gift/dev
        # Retry apt downloads, since the Launchpad PPAs are intermittently unavailable.
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' > /etc/apt/apt.conf.d/80-retries
        apt_ok=0
        for attempt in 1 2 3; do
          if apt update -q && apt install -y --fix-missing build-essential git pkg-config python${{ matrix.python-version }} python${{ matrix.python-version }}-dev python${{ matrix.python-version }}-venv libcreg-python3 libregf-python3 python3-dfdatetime python3-dtfabric python3-pip python3-setuptools python3-yaml tox; then
            apt_ok=1
            break
          fi
          echo "apt attempt ${attempt} failed"
          sleep $((attempt * 30))
        done
        [ "${apt_ok}" = 1 ] || { echo 'apt failed after 3 attempts'; exit 1; }
    - name: Run tests
      env:
        LANG: en_US.UTF-8
      run: |
        tox -e docs
