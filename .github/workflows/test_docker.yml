# Run tests on Fedora and Ubuntu Docker images using GIFT COPR and GIFT PPA on commit
name: test_docker
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
on:
  push:
permissions:
  contents: read
jobs:
  test_fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        version: ['44']
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up container
      run: |
        dnf install -y dnf-plugins-core langpacks-en
    - name: Install dependencies
      run: |
        dnf copr -y enable @gift/dev
        dnf install -y @development-tools libcreg-python3 libregf-python3 python3 python3-build python3-devel python3-dfdatetime python3-dtfabric python3-pyyaml python3-setuptools python3-wheel
    - name: Run tests
      env:
        LANG: C.utf8
      run: |
        python3 ./run_tests.py
    - name: Run end-to-end tests
      run: |
        if test -f tests/end-to-end.py; then PYTHONPATH=. python3 ./tests/end-to-end.py --debug -c config/end-to-end.ini; fi
    - name: Build source distribution (sdist)
      run: |
        python3 -m build --no-isolation --sdist
    - name: Build binary distribution (wheel)
      run: |
        python3 -m build --no-isolation --wheel
  test_ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        version: ['26.04']
    container:
      image: ubuntu:${{ matrix.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up container
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt update -q
        apt install -y libterm-readline-gnu-perl locales software-properties-common
        locale-gen en_US.UTF-8
        ln -f -s /usr/share/zoneinfo/UTC /etc/localtime
    - name: Install dependencies
      run: |
        add-apt-repository -y ppa:gift/dev
        apt update -q
        apt install -y build-essential libcreg-python3 libregf-python3 python3 python3-build python3-dev python3-dfdatetime python3-dtfabric python3-pip python3-setuptools python3-venv python3-wheel python3-yaml
    - name: Run tests
      env:
        LANG: en_US.UTF-8
      run: |
        python3 ./run_tests.py
    - name: Run end-to-end tests
      env:
        LANG: en_US.UTF-8
      run: |
        if test -f tests/end-to-end.py; then PYTHONPATH=. python3 ./tests/end-to-end.py --debug -c config/end-to-end.ini; fi
    - name: Build source distribution (sdist)
      run: |
        python3 -m build --no-isolation --sdist
    - name: Build binary distribution (wheel)
      run: |
        python3 -m build --no-isolation --wheel
